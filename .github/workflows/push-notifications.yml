name: Push Notifications

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  push:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      mongodb:
        image: mongo:4.4.6
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
          MONGO_INITDB_DATABASE: ultimafia
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: "22.17.0"
      - run: npm ci
      # Keep push regressions independently visible even when unrelated legacy
      # tests fail. This job has isolated MongoDB/Redis service containers.
      - run: npm run test:push
        env:
          NODE_ENV: test
          PORT: 3000
          UPLOAD_PATH: uploads
          BASE_URL: http://localhost:3001
          GAME_PORTS: "[3010]"
          CHAT_PORT: 2999
          SOCKET_PING_INTERVAL: 10000
          SERVER_SOCKET_PING_INTERVAL: 2000
          GAME_CREATION_TIMEOUT: 5000
          SESSION_SECRET: x
          LOAD_BALANCER_KEY: x
          BOT_KEY: x
          MONGO_URL: localhost
          MONGO_DB: ultimafia_push
          MONGO_USER: admin
          MONGO_PW: password
          REDIS_URL: redis://127.0.0.1:6379
          REDIS_DB: 0
          FIREBASE_API_KEY: x
          FIREBASE_AUTH_DOMAIN: x
          FIREBASE_PROJECT_ID: x
          FIREBASE_STORAGE_BUCKET: x
          FIREBASE_MESSAGING_SENDER_ID: 1
          FIREBASE_APP_ID: x
          FIREBASE_MEASUREMENT_ID: x
          FIREBASE_JSON_FILE: firebase.json
          EMAIL_DOMAINS: '["gmail.com"]'
          IP_API_URL: https://ipqualityscore.com/api/json/ip
          IP_API_KEY: x
          IP_API_PARAMS: strictness=0&allow_public_access_points=true&fast=true&lighter_penalties=true&mobile=true
          RECAPTCHA_KEY: x
          RESERVED_NAMES: x
          REPORT_DISCORD_WEBHOOK: '[{"boards": ["boardShortId"], "hook": "discordWebhookUrl"}]'
          DEV_USERNAME: x
          DISCORD_ERROR_HOOK: '{"hook": "a"}'
