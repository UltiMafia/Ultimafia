map $http_upgrade $connection_upgrade {  
    default upgrade;
    ''      close;
}

server {
	server_name ultimafia.com;
    # Animated avatars (25 MB) / banners (20 MB) / other uploads need more than nginx default 1m
    client_max_body_size 30m;
    root /usr/share/nginx/html;
    index index.html index.htm index.nginx-debian.html;
	
	# The official nginx image ships with gzip commented out, so without this
	# every JS/CSS/JSON/font file went out uncompressed (~3.4x larger).
	# Express already compresses /api; nginx leaves already-encoded responses alone.
	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types text/plain text/css text/xml application/javascript application/json
	           application/manifest+json application/xml image/svg+xml
	           font/ttf font/otf application/x-font-ttf application/vnd.ms-fontobject;

	# rsbuild emits content-hashed file names under /static/, so they can be
	# cached forever; a new deploy produces new names. ^~ stops the image/audio
	# regex locations below from overriding these headers.
	location ^~ /static/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# The HTML shell must be revalidated so a deploy is picked up immediately.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	location / {
        try_files $uri $uri/ /index.html;
	}
	
	location ^~ /uploads/ {
		alias /uploads/;
		# Uploads (avatars, banners, etc.) live at stable paths and are replaced
		# in place, so browsers must revalidate before each use. Unchanged files
		# cost a tiny 304 via the etag; changed files are seen immediately.
		add_header Cache-Control "public, no-cache, no-transform";
	}

	location /chatSocket {
		proxy_pass http://backend:2999;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
########proxy_cache my_cache;
########proxy_cache_valid 200 30m;
########proxy_cache_methods GET HEAD;
########proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
########proxy_cache_bypass $http_upgrade;
	}

	location /3010 {
	    proxy_pass http://backend:3010/;
        proxy_http_version 1.1;
	    proxy_set_header Upgrade $http_upgrade;
	    proxy_set_header Connection $connection_upgrade;
	    proxy_set_header Host $host;
