services:
  # Local dev only: do not start these when Docker starts. Docker's
  # "unless-stopped" policy is what made the site come back after boot.
  # Production uses docker-compose-core.yml + docker-compose-prod.yml and is
  # unaffected.
  mongodb:
    restart: "no"

  redis:
    restart: "no"

  # frontend service via npm start
  web:
    depends_on:
      - backend
    container_name: "web"
    restart: "no"
    build:
      context: react_main
      dockerfile: dockerfile
      target: development
    expose:
      - 80
    ports:
      - "80:3001"
      - "3001:3001"
    volumes:
      - ./:/home/um/
      - web_node_modules:/home/um/react_main/node_modules
    networks:
      - my_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Overrides for exposing backend ports
  backend:
    restart: "no"
    expose:
      - 2999
      - 3000
      - 5858
      - 3010
      - 9230
      - 9231
      - 9232
    ports:
      - "2999:2999"
      - "3000:3000"
      - "3010:3010"
      - "5858:5858"
      - "9230:9230"
      - "9231:9231"
      - "9232:9232"
    volumes:
      - backend_node_modules:/home/um/node_modules

volumes:
  web_node_modules:
  backend_node_modules:
